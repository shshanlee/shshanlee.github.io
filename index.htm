<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Shan  · 日常</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #faf8f6;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Poppins', 'Hiragino Sans', 'Yu Gothic', system-ui, -apple-system, sans-serif;
            padding: 16px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1.2;
            border-radius: 36px;
            background: linear-gradient(145deg, #f5f0ec, #ede6e0, #e8dfd9);
            box-shadow: 0 20px 50px rgba(0,0,0,0.08), 0 0 0 1px rgba(200, 180, 170, 0.15) inset;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.10), 0 0 0 1px rgba(200, 180, 170, 0.2) inset;
        }

        /* subtle decorative pattern */
        .container::before {
            content: '✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            font-size: 1.2rem;
            letter-spacing: 24px;
            word-break: break-all;
            opacity: 0.04;
            pointer-events: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 30px;
            line-height: 2.8;
            z-index: 0;
        }

        .container .content {
            position: relative;
            z-index: 1;
        }

        /* simple divider line */
        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #d4c5bc, #b8a69b, #d4c5bc);
            margin: 16px auto;
            border-radius: 2px;
        }

        .name-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .name {
            font-size: clamp(2.8rem, 12vw, 4.5rem);
            font-weight: 300;
            letter-spacing: 0.06em;
            color: #5a4a40;
            font-family: 'Times New Roman', 'Georgia', serif;
        }

        .name-ampersand {
            font-size: clamp(1.8rem, 6vw, 2.8rem);
            font-weight: 200;
            color: #b8a69b;
            font-family: 'Times New Roman', 'Georgia', serif;
        }

        .subtitle {
            font-size: clamp(1rem, 3.5vw, 1.4rem);
            font-weight: 300;
            color: #8a7a70;
            letter-spacing: 0.12em;
            margin-top: 4px;
            font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
        }

        .date {
            font-size: clamp(0.85rem, 2.8vw, 1.1rem);
            font-weight: 300;
            color: #b0a095;
            letter-spacing: 0.15em;
            margin-top: 6px;
        }

        .description {
            font-size: clamp(0.95rem, 3vw, 1.2rem);
            font-weight: 300;
            color: #7a6a60;
            line-height: 1.7;
            max-width: 340px;
            margin: 16px auto 0;
            letter-spacing: 0.03em;
        }

        .description span {
            display: inline-block;
            opacity: 0.7;
        }

        .footer-note {
            position: absolute;
            bottom: 28px;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            color: #c0b0a5;
            opacity: 0.5;
            z-index: 1;
            font-weight: 300;
        }

        @media (max-width: 420px) {
            .container {
                border-radius: 24px;
                padding: 30px 20px;
                aspect-ratio: 1 / 1.3;
            }
            .container::before {
                font-size: 0.9rem;
                letter-spacing: 16px;
                line-height: 2.2;
            }
            .name-group {
                gap: 12px;
            }
            .footer-note {
                bottom: 20px;
                font-size: 0.6rem;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .container {
                max-width: 70vh;
                aspect-ratio: 1 / 1.1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="name-group">
                <span class="name">Shan</span>
                <span class="name-ampersand"></span>
                <span class="name">Shan</span>
            </div>

            <div class="divider"></div>

            <div class="subtitle">Together  Everyday</div>

            <div class="date">Since 2000</div>

            <div class="description">
                <span>✦</span>  Connected   <span>✦</span>
            </div>
        </div>

        <div class="footer-note">✦  ✦  ✦</div>
    </div>
</body>
</html>
